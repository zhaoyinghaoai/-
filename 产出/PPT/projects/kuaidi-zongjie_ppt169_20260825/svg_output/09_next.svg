<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <rect id="page-background" x="0" y="0" width="1280" height="720" fill="#F0F3F8" data-pptx-role="background"/>
  <g id="page-header" data-pptx-bounds="80 50 1120 80">
    <rect x="80" y="50" width="8" height="40" fill="#1B3A5C"/>
    <text x="110" y="85" font-size="32" font-weight="bold" fill="#1B3A5C">下一步挑战</text>
    <text x="110" y="112" font-size="16" fill="#8B95A7">快递量趋稳，服务边界还可以更宽</text>
  </g>
  <g id="question-block" data-pptx-bounds="240 210 800 200">
    <text x="640" y="290" font-size="48" font-weight="bold" fill="#1B3A5C" text-anchor="middle">代收之外，</text>
    <text x="640" y="360" font-size="48" font-weight="bold" fill="#3B82C4" text-anchor="middle">还能为村民做什么？</text>
  </g>
  <g id="idea-1" data-pptx-bounds="80 450 360 200">
    <rect x="80" y="450" width="360" height="200" rx="16" fill="#FFFFFF"/>
    <circle cx="160" cy="510" r="28" fill="#FEF3C7"/>
    <text x="160" y="520" font-size="28" font-weight="bold" fill="#E8A533" text-anchor="middle">A</text>
    <text x="210" y="510" font-size="20" font-weight="bold" fill="#1B3A5C">代寄服务</text>
    <text x="210" y="540" font-size="16" fill="#8B95A7">帮村民寄件代办</text>
    <text x="120" y="590" font-size="16" fill="#4A5568">
      <tspan x="120" dy="0">村民不出村即可寄快递</tspan>
      <tspan x="120" dy="28">打通双向物流</tspan>
    </text>
  </g>
  <g id="idea-2" data-pptx-bounds="460 450 360 200">
    <rect x="460" y="450" width="360" height="200" rx="16" fill="#FFFFFF"/>
    <circle cx="540" cy="510" r="28" fill="#DBEAFE"/>
    <text x="540" y="520" font-size="28" font-weight="bold" fill="#3B82C4" text-anchor="middle">B</text>
    <text x="590" y="510" font-size="20" font-weight="bold" fill="#1B3A5C">生活服务</text>
    <text x="590" y="540" font-size="16" fill="#8B95A7">代缴代购代办</text>
    <text x="500" y="590" font-size="16" fill="#4A5568">
      <tspan x="500" dy="0">水电费代缴、日用品代购</tspan>
      <tspan x="500" dy="28">成为村级服务站</tspan>
    </text>
  </g>
  <g id="idea-3" data-pptx-bounds="840 450 360 200">
    <rect x="840" y="450" width="360" height="200" rx="16" fill="#FFFFFF"/>
    <circle cx="920" cy="510" r="28" fill="#E0E7FF"/>
    <text x="920" y="520" font-size="28" font-weight="bold" fill="#1B3A5C" text-anchor="middle">C</text>
    <text x="970" y="510" font-size="20" font-weight="bold" fill="#1B3A5C">数据赋能</text>
    <text x="970" y="540" font-size="16" fill="#8B95A7">用数据优化服务</text>
    <text x="880" y="590" font-size="16" fill="#4A5568">
      <tspan x="880" dy="0">分析取件规律、高峰时段</tspan>
      <tspan x="880" dy="28">精准调配资源</tspan>
    </text>
  </g>
  <g id="page-footer" data-pptx-bounds="80 690 1120 20">
    <text x="1200" y="705" font-size="12" fill="#8B95A7" text-anchor="end">09</text>
  </g>
</svg>