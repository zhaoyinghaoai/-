    <text x="1020" y="520" font-size="56" font-weight="bold" fill="#1B3A5C" text-anchor="middle">200+</text>
    <text x="1020" y="560" font-size="20" fill="#3B82C4" text-anchor="middle">户</text>
    <text x="1020" y="620" font-size="18" fill="#8B95A7" text-anchor="middle">覆盖户数（全村常住人口）</text>
