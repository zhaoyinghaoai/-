    <text x="260" y="520" font-size="56" font-weight="bold" fill="#1B3A5C" text-anchor="middle">0</text>
    <text x="260" y="560" font-size="20" fill="#1B3A5C" text-anchor="middle">件</text>
    <text x="260" y="620" font-size="18" fill="#8B95A7" text-anchor="middle">差错记录（零丢件零错发）</text>
  </g>
  <g id="card-5" data-pptx-bounds="460 430 360 240">
    <rect x="460" y="430" width="360" height="240" rx="16" fill="#FFFFFF"/>
    <rect x="460" y="430" width="360" height="6" rx="3" fill="#E8A533"/>
    <text x="640" y="520" font-size="56" font-weight="bold" fill="#1B3A5C" text-anchor="middle">365</text>
    <text x="640" y="560" font-size="20" fill="#E8A533" text-anchor="middle">天</text>
    <text x="640" y="620" font-size="18" fill="#8B95A7" text-anchor="middle">运营天数（全年无休）</text>
