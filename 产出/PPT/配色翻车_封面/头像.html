<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 400px;
    height: 400px;
    background: #1F4E79;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .ppt {
    font-size: 120px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: 4px;
    line-height: 1;
  }
  .name {
    font-size: 48px;
    font-weight: 700;
    color: #FFFFFF;
    margin-top: 16px;
    letter-spacing: 8px;
    opacity: 0.9;
  }
  .line {
    width: 60px;
    height: 3px;
    background: #E63946;
    margin-top: 20px;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="ppt">PPT</div>
  <div class="line"></div>
  <div class="name">浩哥</div>
</body>
</html>
