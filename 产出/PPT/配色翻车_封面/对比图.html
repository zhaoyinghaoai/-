<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配色对比图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    background: #FFFFFF;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ===== 顶部标题区 ===== */
  .header {
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1A1A1A;
  }
  .header-text {
    font-size: 44px;
    font-weight: 800;
    color: #FFFFFF;
    letter-spacing: 3px;
  }
  .header-text .red { color: #E63946; }

  /* ===== 上半部分：翻车版 ===== */
  .bad-section {
    height: 580px;
    background: #FAFAFA;
    padding: 30px 50px;
    position: relative;
  }

  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .label-badge {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 900;
    color: #FFFFFF;
  }
  .label-badge.bad { background: #E63946; }
  .label-badge.good { background: #06A77D; }
  .label-text {
    font-size: 32px;
    font-weight: 800;
  }
  .label-text.bad { color: #E63946; }
  .label-text.good { color: #06A77D; }

  /* 模拟PPT - 翻车版 */
  .mock-ppt-bad {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 35px 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    height: 440px;
  }
  .mock-title-bad {
    font-size: 38px;
    font-weight: 800;
    color: #E63946;
    margin-bottom: 8px;
  }
  .mock-subtitle-bad {
    font-size: 22px;
    font-weight: 600;
    color: #118AB2;
    margin-bottom: 25px;
  }
  .mock-point-bad {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .mock-dot-bad {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .mock-point-text-bad {
    font-size: 22px;
    line-height: 1.5;
  }
  .mock-footer-bad {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px dashed #DDD;
    font-size: 20px;
    font-weight: 600;
  }

  /* 色块标注 */
  .color-tags {
    display: flex;
    gap: 6px;
    position: absolute;
    top: 35px;
    right: 50px;
  }
  .color-tag {
    width: 28px;
    height: 28px;
    border-radius: 4px;
  }

  /* ===== 中间箭头区 ===== */
  .arrow-section {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFF;
    position: relative;
  }
  .arrow-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .arrow-icon {
    font-size: 48px;
    color: #1A1A1A;
    line-height: 1;
  }
  .arrow-text {
    font-size: 26px;
    font-weight: 700;
    color: #666;
    letter-spacing: 1px;
  }

  /* ===== 下半部分：专业版 ===== */
  .good-section {
    height: 580px;
    background: #F5F5F5;
    padding: 30px 50px;
    position: relative;
  }

  /* 模拟PPT - 专业版 */
  .mock-ppt-good {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 35px 40px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    height: 440px;
    border-top: 6px solid #1F4E79;
  }
  .mock-title-good {
    font-size: 38px;
    font-weight: 800;
    color: #1F4E79;
    margin-bottom: 8px;
  }
  .mock-subtitle-good {
    font-size: 22px;
    font-weight: 600;
    color: #999999;
    margin-bottom: 25px;
  }
  .mock-point-good {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .mock-dot-good {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #1F4E79;
    margin-top: 8px;
    flex-shrink: 0;
  }
  .mock-point-text-good {
    font-size: 22px;
    line-height: 1.5;
    color: #333333;
  }
  .mock-highlight-good {
    color: #E63946;
    font-weight: 700;
  }
  .mock-footer-good {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px solid #E0E0E0;
    font-size: 20px;
    font-weight: 600;
    color: #1F4E79;
  }

  /* ===== 底部 ===== */
  .footer {
    height: 20px;
    background: #1A1A1A;
  }
</style>
</head>
<body>

  <!-- 顶部标题 -->
  <div class="header">
    <div class="header-text">7种颜色 → 3种颜色 <span class="red">客户态度变了</span></div>
  </div>

  <!-- 上：翻车版 -->
  <div class="bad-section">
    <div class="section-label">
      <div class="label-badge bad">✗</div>
      <div class="label-text bad">翻车版 · 7种颜色</div>
    </div>
    <div class="color-tags">
      <div class="color-tag" style="background:#E63946;"></div>
      <div class="color-tag" style="background:#118AB2;"></div>
      <div class="color-tag" style="background:#06A77D;"></div>
      <div class="color-tag" style="background:#F77F00;"></div>
      <div class="color-tag" style="background:#7209B7;"></div>
      <div class="color-tag" style="background:#06A77D;"></div>
      <div class="color-tag" style="background:#F72585;"></div>
    </div>

    <div class="mock-ppt-bad">
      <div class="mock-title-bad">2024年度工作汇报</div>
      <div class="mock-subtitle-bad">各部门业绩总结与规划</div>

      <div class="mock-point-bad">
        <div class="mock-dot-bad" style="background:#06A77D;"></div>
        <div class="mock-point-text-bad" style="color:#06A77D;">销售额同比增长25%，超额完成年度目标</div>
      </div>
      <div class="mock-point-bad">
        <div class="mock-dot-bad" style="background:#F77F00;"></div>
        <div class="mock-point-text-bad" style="color:#F77F00;">新客户开发52家，覆盖3个新区域</div>
      </div>
      <div class="mock-point-bad">
        <div class="mock-dot-bad" style="background:#7209B7;"></div>
        <div class="mock-point-text-bad" style="color:#7209B7;">团队扩编至28人，培训覆盖100%</div>
      </div>
      <div class="mock-point-bad">
        <div class="mock-dot-bad" style="background:#F72585;"></div>
        <div class="mock-point-text-bad" style="color:#F72585;">客户满意度达96%，复购率提升18%</div>
      </div>

      <div class="mock-footer-bad" style="color:#118AB2;">
        📊 下一步：拓展华南市场 · 优化供应链
      </div>
    </div>
  </div>

  <!-- 中间箭头 -->
  <div class="arrow-section">
    <div class="arrow-box">
      <div class="arrow-icon">↓</div>
      <div class="arrow-text">改成3色 · 深蓝+浅灰+红</div>
    </div>
  </div>

  <!-- 下：专业版 -->
  <div class="good-section">
    <div class="section-label">
      <div class="label-badge good">✓</div>
      <div class="label-text good">专业版 · 3种颜色</div>
    </div>
    <div class="color-tags">
      <div class="color-tag" style="background:#1F4E79;"></div>
      <div class="color-tag" style="background:#999999;"></div>
      <div class="color-tag" style="background:#E63946;"></div>
    </div>

    <div class="mock-ppt-good">
      <div class="mock-title-good">2024年度工作汇报</div>
      <div class="mock-subtitle-good">各部门业绩总结与规划</div>

      <div class="mock-point-good">
        <div class="mock-dot-good"></div>
        <div class="mock-point-text-good">销售额同比增长<span class="mock-highlight-good">25%</span>，超额完成年度目标</div>
      </div>
      <div class="mock-point-good">
        <div class="mock-dot-good"></div>
        <div class="mock-point-text-good">新客户开发52家，覆盖3个新区域</div>
      </div>
      <div class="mock-point-good">
        <div class="mock-dot-good"></div>
        <div class="mock-point-text-good">团队扩编至28人，培训覆盖100%</div>
      </div>
      <div class="mock-point-good">
        <div class="mock-dot-good"></div>
        <div class="mock-point-text-good">客户满意度达<span class="mock-highlight-good">96%</span>，复购率提升18%</div>
      </div>

      <div class="mock-footer-good">
        📊 下一步：拓展华南市场 · 优化供应链
      </div>
    </div>
  </div>

  <!-- 底部 -->
  <div class="footer"></div>

</body>
</html>
