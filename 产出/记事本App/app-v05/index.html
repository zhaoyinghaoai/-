<meta name="apple-mobile-web-app-title" content="随手库" data-page-node-id="7FyGIYV0cxhjvlH9K2G9mH">
<style>
  :root{
    --bg:#F5F0E6;--card:#FFFFFF;--ink:#2B2620;--ink2:#6E6659;--ink3:#ADA493;
    --accent:#C05621;--accent-deep:#A34419;--accent-soft:#F6E7DA;--line:#EDE5D6;
    --shadow:0 1px 2px rgba(60,45,20,.05),0 8px 24px rgba(60,45,20,.07);--radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
  }
  .shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;z-index:0}
  body.desktop{background:radial-gradient(1200px 700px at 70% -10%,#EFE7D8 0%,#E4DAC6 55%,#DDD2BC 100%)}
  body.desktop .phone{width:400px;height:min(860px,94vh);border-radius:52px;box-shadow:0 30px 80px rgba(50,35,10,.35),0 0 0 10px #1B1916,0 0 0 12px #333}
  .phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:520px){body:not(.desktop){display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 70% -10%,#EFE7D8 0%,#E4DAC6 55%,#DDD2BC 100%)}body:not(.desktop) .phone{width:400px;height:min(860px,96vh);border-radius:52px;box-shadow:0 30px 80px rgba(50,35,10,.35),0 0 0 10px #1B1916,0 0 0 12px #333}}

  .screens{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;overflow-y:auto;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));display:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .screen::-webkit-scrollbar{display:none}
  .screen.active{display:block}

  /* ============ 首页翻卡 ============ */
  #home{padding:0;display:none;flex-direction:column}
  #home.active{display:flex}
  .home-top{flex:none;display:flex;align-items:center;gap:10px;padding:13px 18px 8px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#D0602B,#A8481D);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;box-shadow:0 2px 8px rgba(192,86,33,.4)}
  .brand .nm{font-size:21px;font-weight:800;letter-spacing:1px}
  .ver-tag{font-size:11px;color:var(--ink3);font-weight:600;margin-left:3px;letter-spacing:.5px}
  .page-num{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:2px}
  .top-right{margin-left:auto;display:flex}
  .iconbtn{border:none;background:none;width:40px;height:40px;border-radius:12px;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .iconbtn:active{background:#ECE4D4}
  .flipwrap{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding:6px 0 24px;-webkit-overflow-scrolling:touch}
  .flipwrap::-webkit-scrollbar{display:none}
  .flipcard{
    display:block;padding:7px 14px;animation:fadeUp .35s ease;
  }
  /* 电脑预览翻页控件（手机不显示） */
  body.desktop .flipnav{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:20}
  .flipnav{display:none}
  body.desktop .flipnav button{
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:22px;
    background:rgba(255,255,255,.92);color:var(--accent);box-shadow:0 4px 14px rgba(60,45,20,.18);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  }
  body.desktop .flipnav button:active{transform:scale(.94)}
  @keyframes fadeUp{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fc-pad{overflow:visible;flex:none}
  .fc-pad::-webkit-scrollbar{display:none}
  .fc-card{
    background:var(--card);border:1px solid rgba(237,229,214,.6);border-radius:20px;
    box-shadow:var(--shadow);padding:20px 18px 6px;
  }
  .fc-card.flash{animation:flash 1.5s ease}
  @keyframes flash{0%{box-shadow:0 0 0 4px rgba(192,86,33,.5)}100%{box-shadow:var(--shadow)}}
  .fc-meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink3);margin-bottom:16px}
  .fc-meta .kind{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .fc-meta .kind.img{background:#8A9B7E}
  .fc-meta .tag{background:var(--accent-soft);color:var(--accent-deep);font-weight:700;padding:3px 12px;border-radius:30px;font-size:13px}
  .fc-meta .t{font-weight:600;margin-left:auto;letter-spacing:.5px}
  .fc-media{width:100%;border-radius:18px;margin-bottom:18px;max-height:38vh;object-fit:cover;background:#EDE7DB}
  .fc-text{font-size:14px;line-height:1.9;letter-spacing:.1px;white-space:pre-wrap;word-break:break-word;color:var(--ink);font-weight:400}
  .fc-actions{flex:none;display:flex;gap:10px;padding:10px 4px 0}
  .fc-edit{flex:none;width:88px;height:50px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .fc-edit:active{background:#F7F2E8}
  .fc-copy{
    flex:1;height:50px;border-radius:16px;border:none;cursor:pointer;
    background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;font-size:17px;font-weight:800;letter-spacing:1px;
    box-shadow:0 3px 12px rgba(192,86,33,.35);display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .fc-copy:active{transform:scale(.985)}
  .flip-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--ink3);font-size:17px;line-height:2;padding:0 30px}
  .flip-empty .big{font-size:56px}
  .flip-empty button{margin-top:10px;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;border:none;border-radius:18px;height:58px;padding:0 34px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(192,86,33,.4)}

  /* ============ 其他页面字号放大 ============ */
  .nav{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:6px;padding:14px 0 6px}
  .nav .back{border:none;background:none;font-size:26px;color:var(--ink);cursor:pointer;padding:2px 10px 2px 0;line-height:1}
  .nav .ttl{font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav .act{border:none;background:none;color:var(--accent);font-size:17px;font-weight:800;cursor:pointer;padding:8px 4px}
  .nav .act.dim{color:var(--ink3);font-weight:600;font-size:21px}
  .new-hint{font-size:14px;color:var(--ink3);background:#FBF7EE;border:1px dashed #E2D6C0;border-radius:14px;padding:11px 14px;margin:4px 0 12px;line-height:1.8}
  .attach-box{display:flex;gap:10px;flex-wrap:wrap;padding:2px 0 10px}
  .imgth{width:104px;height:104px;border-radius:16px;position:relative;overflow:hidden;flex:none}
  .imgth img{width:100%;height:100%;object-fit:cover}
  .imgth .x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:14px;cursor:pointer;line-height:1}
  .editor{width:100%;min-height:200px;border:none;outline:none;background:transparent;resize:none;font-size:20px;line-height:1.95;color:var(--ink);font-family:inherit;padding:4px 2px;font-weight:500}
  .editor::placeholder{color:var(--ink3);font-weight:400}
  /* ===== 块编辑器 v0.9 ===== */
  .blkedit{display:flex;flex-direction:column;gap:10px;padding:2px 0 6px}
  .blk{position:relative;border-radius:16px;background:#fff;border:1px solid #F0E9DB;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .blk .blk-x{position:absolute;top:8px;right:8px;z-index:6;width:24px;height:24px;border-radius:50%;background:rgba(43,38,32,.06);color:var(--ink2);border:none;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .blk .blk-x:active{background:rgba(43,38,32,.16)}
  .blk-t{width:100%;min-height:44px;border:none;outline:none;background:transparent;resize:none;font-size:14px;line-height:1.85;color:var(--ink);font-family:inherit;padding:6px 26px 6px 0;font-weight:400}
  .blk-t.ph::after{content:attr(data-ph);color:var(--ink3);font-weight:400;pointer-events:none}
  .blk .blk-ph{font-size:14px;line-height:1.85;color:var(--ink3);font-weight:400;padding:6px 0;display:block}
  .blk-media{border-radius:12px;overflow:hidden;background:#F4EFE4}
  .blk-media img{width:100%;display:block;max-height:70vh;object-fit:contain}
  .blk-video{border-radius:12px;overflow:hidden;background:#F4EFE4}
  .blk-video video{width:100%;display:block;max-height:70vh}
  .blk-link{width:100%;border:none;outline:none;background:transparent;font-size:16px;color:var(--accent-deep);padding:4px 0;font-weight:600}
  .blk-link.ph::after{content:attr(data-ph);color:var(--ink3);font-weight:400}
  .pickpic{position:relative;border-radius:14px;overflow:hidden}
  .pickpic input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;z-index:5}
  .imgbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:#fff;border:1.5px dashed #D8CBB2;border-radius:14px;padding:13px;font-size:15.5px;font-weight:700;color:var(--ink2);cursor:pointer}
  .addtools{display:flex;gap:8px;margin:2px 0 4px}
  .add-btn{flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 4px;font-size:14.5px;font-weight:700;color:var(--ink2);cursor:pointer}
  .add-btn:active{background:#F7F2E8}
  .add-btn .mi{display:block;font-size:18px;margin-bottom:1px}
  .blk .blk-hint{font-size:13px;color:var(--ink3);margin-top:2px}
  .inputtools{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 4px;background:linear-gradient(180deg,rgba(245,240,230,0) 0%,var(--bg) 35%)}
  .toolbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:16px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbtn:active{background:#F7F2E8}
  .toolbtn.mic{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;font-size:18px}
  .toolbtn.pic{padding:14px 18px}

  /* 语音 */
  .micoverlay{position:absolute;inset:0;background:rgba(43,38,32,.74);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
  .micoverlay.on{display:flex}
  .mic-ring{width:122px;height:122px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,86,33,.45)}70%{box-shadow:0 0 0 36px rgba(192,86,33,0)}100%{box-shadow:0 0 0 0 rgba(192,86,33,0)}}
  .mic-ring svg{width:46px;height:46px;fill:#fff}
  .mic-wave{display:flex;gap:5px;align-items:center;height:36px}.mic-wave i{width:4px;border-radius:2px;background:#fff;animation:wave 1s ease-in-out infinite}
  .mic-wave i:nth-child(1){height:15px}.mic-wave i:nth-child(2){height:32px;animation-delay:.1s}.mic-wave i:nth-child(3){height:21px;animation-delay:.2s}.mic-wave i:nth-child(4){height:34px;animation-delay:.3s}.mic-wave i:nth-child(5){height:17px;animation-delay:.4s}.mic-wave i:nth-child(6){height:30px;animation-delay:.15s}.mic-wave i:nth-child(7){height:13px;animation-delay:.35s}
  @keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
  .mic-label{color:#fff;font-size:17px;font-weight:800;letter-spacing:1px}
  .mic-sub{color:rgba(255,255,255,.8);font-size:13px}
  .tip-card{background:#FFF7EC;border:1px solid #F0DFC4;border-radius:14px;padding:13px 15px;margin:10px 0;font-size:15px;line-height:1.9;color:var(--ink2)}
  .tip-card b{color:var(--accent-deep)}

  /* 详情 */
  .detail-time{font-size:14px;color:var(--ink3);margin:2px 2px 12px}
  .d-body{background:var(--card);border:1px solid rgba(237,229,214,.6);border-radius:22px;box-shadow:var(--shadow);padding:22px}
  .d-body .bigimg{width:100%;border-radius:14px;margin-bottom:16px;max-height:300px;object-fit:cover}
  .d-body textarea{width:100%;min-height:200px;border:none;outline:none;background:transparent;font-size:19px;line-height:2;color:var(--ink);font-family:inherit;resize:vertical;font-weight:500}
  .d-bar{display:flex;gap:10px;align-items:center;margin-top:16px}
  .d-main{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;border:none;border-radius:18px;height:56px;font-size:18px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 16px rgba(192,86,33,.35)}
  .d-main:active{transform:scale(.985)}
  .d-sec{height:56px;padding:0 20px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:16px;font-weight:700;cursor:pointer}

  /* 搜索 */
  .s-input{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;flex:1;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .s-input input{border:none;outline:none;flex:1;font-size:18px;background:transparent;color:var(--ink);font-family:inherit;min-width:0}
  .s-input input::placeholder{color:var(--ink3)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
  .chip{font-size:15px;background:#fff;border:1px solid var(--line);color:var(--ink2);padding:8px 16px;border-radius:30px;cursor:pointer}
  .chip:active{background:var(--accent-soft)}
  .s-count{font-size:14px;color:var(--ink3);margin:16px 2px 10px}
  mark{background:#F6D9A8;color:inherit;border-radius:3px;padding:0 1px}
  .card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid rgba(237,229,214,.6);transition:transform .12s ease}
  .card:active{transform:scale(.985)}
  .card-head{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);margin-bottom:10px}
  .card-head .kind{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .card-head .kind.img{background:#8A9B7E}
  .card-head .time{margin-left:auto;font-weight:600}
  .card-text{font-size:18px;line-height:1.9;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .card.media .media-row{display:flex;gap:12px;align-items:stretch}
  .card.media .thumb{width:96px;height:96px;border-radius:14px;flex:none;overflow:hidden;background:#EDE7DB;display:flex;align-items:center;justify-content:center}
  .card.media .thumb img{width:100%;height:100%;object-fit:cover}
  .card.media .card-text{-webkit-line-clamp:4;font-size:17px}
  .card-actions{display:flex;align-items:center;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid #F3EDE1}
  .btn-copy{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--accent);font-size:15px;font-weight:800;background:none;border:none;cursor:pointer;padding:7px 9px;border-radius:9px}
  .btn-copy:active{background:var(--accent-soft)}
  .empty{padding:60px 12px;text-align:center;color:var(--ink3);font-size:16px;line-height:2.1}
  .empty .big{font-size:46px;display:block;margin-bottom:10px}

  /* 底栏 */
  .tabbar{flex:none;height:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:stretch;position:relative;z-index:10}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--ink3);font-size:12px;font-weight:600}
  .tab.active{color:var(--accent)}.tab .ico{font-size:21px;line-height:1}
  .tab-plus-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;position:relative}
  .tab-plus{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;margin-top:-22px;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;font-size:27px;box-shadow:0 6px 18px rgba(192,86,33,.45);display:flex;align-items:center;justify-content:center}
  .tab-plus:active{transform:scale(.94)}

  /* 弹层 */
  .sheet-mask{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-mask.on{display:flex}
  .sheet{width:min(470px,100%);background:#FFFDF8;border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .bar{width:42px;height:4px;border-radius:2px;background:#E2D9C6;margin:4px auto 14px}
  .sheet h3{font-size:17px;margin-bottom:4px;font-weight:800}
  .srow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #F1EADA;font-size:16px;font-weight:600;cursor:pointer}
  .srow:last-child{border-bottom:none}.srow:active{background:#F7F1E4;border-radius:10px}
  .srow .si{font-size:20px}
  .srow.danger{color:#C0392B}
  .srow small{color:var(--ink3);font-size:13px;margin-left:auto;font-weight:400}

  /* ============ 类目条（小米笔记式） ============ */
  .catbar{flex:none;display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .catbar::-webkit-scrollbar{display:none}
  .catpill{flex:none;font-size:16px;font-weight:700;padding:9px 20px;border-radius:30px;background:#fff;border:1px solid var(--line);color:var(--ink2);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .catpill.on{background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(192,86,33,.35)}
  .catpill:active{transform:scale(.96)}
  .catpill.manage{border-style:dashed;color:var(--accent);border-color:#D8B9A0;background:#FFF8EF;font-size:15px;padding:9px 16px}
  .catinput{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:16px;outline:none;background:#fff;font-family:inherit;min-width:0}
  .catinput:focus{border-color:var(--accent)}
  .delcat{width:36px;height:36px;border-radius:50%;border:none;background:#FBE9E4;color:#C0392B;font-size:15px;cursor:pointer;flex:none}
  .rencat{height:36px;padding:0 14px;border-radius:18px;border:none;background:#EEF3F8;color:#3A6B9C;font-size:14.5px;font-weight:600;cursor:pointer;flex:none}
  .rencat:active{background:#DDE9F3}
  .delcat:active{transform:scale(.92)}
  /* 保存大按钮 */

<script>
/* ================= 存储（v0.9：块式内容，一条可含文字/图片/视频链接，任意穿插） ================= */
const KEY = 'suishouku_v09';
const KEY_OLD = 'suishouku_v05';
let items = [];
try{ items = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ items = []; }
if(!items.length){ try{ items = JSON.parse(localStorage.getItem(KEY_OLD)) || []; }catch(e){} } // 兼容旧版数据
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---- 块式内容辅助 ----
   每条素材统一为 blocks 数组：[{type:'t',t}, {type:'img',d}, {type:'video',u}]
   旧数据没有 blocks 时，由 text/img 惰性生成单块（向后兼容） */
function blks(it){
  if(!it) return [];
  if(Array.isArray(it.blocks) && it.blocks.length) return it.blocks;
  // 旧式：单文本 / 图+文
  const out=[];
  if(it.text && String(it.text).trim() && it.text !== '(图片)') out.push({type:'t', t:it.text});
  if(it.img) out.push({type:'img', d:it.img});
  if(it.kind==='video' && it.vsrc) out.push({type:'video', u:it.vsrc, title:it.vtitle||''});
  if(!out.length && it.img) out.push({type:'img', d:it.img});
  if(!out.length && it.text) out.push({type:'t', t:it.text});
  return out;
}
function textOf(it){ // 汇总纯文字（供搜索/复制）
  const ts=[]; (blks(it)||[]).forEach(b=>{ if(b.type==='t' && b.t) ts.push(b.t); }); return ts.join('\n');
}
function firstMedia(it){ // 取第一张图/视频供缩略
  const b=(blks(it)||[]).find(x=>x.type==='img'||x.type==='video'); return b||null;
}
function hasMedia(it){ return (blks(it)||[]).some(x=>x.type==='img'||x.type==='video'); }


/* ================= 分类（类目，小米笔记式，可自定义） ================= */
const CKEY='suishouku_cats_v05';
const DEF_CATS=['写作','读书','灵感','生活','杂记'];
function loadCats(){ try{ const s=localStorage.getItem(CKEY); if(s){ const a=JSON.parse(s); if(Array.isArray(a)&&a.length&&a.some(x=>x==='杂记')) return a; } }catch(e){} return DEF_CATS.slice(); }
let CATS=loadCats();
function saveCats(){ localStorage.setItem(CKEY, JSON.stringify(CATS)); }
let curCat='全部';
let newCat='写作';
/* v1.04：目录＝纯类目清单，不再有「全部」混装入口（把各类笔记堆一起）。
   LOST＝兜底：类目被删/改名后掉队的笔记，不能让它悄悄消失。 */
const LOST='未归类';
function lostItems(){ return items.filter(it=>CATS.indexOf(it.category)<0); }
function catItems(cat){ return cat===LOST ? sorted().filter(it=>CATS.indexOf(it.category)<0) : sorted().filter(it=>it.category===cat); }
function buildCatsHTML(){
  return '<h3>管理类目</h3>'
    +'<div style="margin:8px 0 2px">'
    + CATS.map(catRow).join('')
    +'</div>'

/* 改名：面板内输入（不用 prompt——部分手机浏览器/桌面图标模式会静默拦截弹窗） */
function startRename(c){
  renaming=c; delArm=null;
  $('#sheetBody').innerHTML=buildCatsHTML();

  if(i){ i.focus(); try{ i.select(); }catch(e){}

function confirmRename(){
  const i=$('#renameInput'); if(!i||!renaming) return;
  const c=renaming, nv=i.value.trim();
  if(!nv) return toast('名字不能为空');
  if(nv.length>10) return toast('最多10个字');
  if(nv===c){ cancelRename(); return; }
  if(CATS.includes(nv)) return toast('已经有「'+nv+'」了');
  CATS=CATS.map(x=>x===c?nv:x); saveCats();
  items.forEach(it=>{ if(it.category===c) it.category=nv; }); save();

/* 删除：两步确认（第一步✕变红「确认删?」，再点一次才真删；4秒不点自动复位） */
function armDel(c){
  if(c==='杂记') return;
  delArm=c; renaming=null;
  $('#sheetBody').innerHTML=buildCatsHTML();
  setTimeout(()=>{ if(delArm===c && !renaming){ delArm=null; $('#sheetBody').innerHTML=buildCatsHTML(); } },4000);
}
function doDelCat(c){
  delArm=null;
  items.forEach(it=>{ if(it.category===c) it.category='杂记'; });
  CATS=CATS.filter(x=>x!==c); save(); saveCats();
  if(curCat===c) curCat='全部';
  if(newCat===c) newCat='杂记';
  $('#sheetBody').innerHTML=buildCatsHTML();
  renderCatbar(); renderCatpick(); renderHome();
  toast('已删「'+c+'」，素材都转进杂记了');

function addCat(){
  const v=$('#catInput').value.trim();
  if(!v) return toast('先输入类目名');
  if(CATS.includes(v)) return toast('已经有「'+v+'」了');

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2100); }
function fmtDate(ts){
  const d=new Date(ts), now=new Date();
  const y=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(y(d)===y(now)) return '今天 '+hm;
  const yest=new Date(now); yest.setDate(now.getDate()-1);
  if(y(d)===y(yest)) return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function shortDate(ts){
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function sorted(){ return items.slice().sort((a,b)=>b.ts-a.ts); }

/* ================= 定时提醒（v1.01） =================
   两种设定方式：
   ① 加时间段：从现在起 N 分钟 / N 小时 / N 天（如 11:54 + 1小时 = 12:54）
   ② 加时刻：像闹钟一样指定 今天/明天 HH:MM
   数据落在条目上：it.remindAt = 时间戳；it.reminded = 是否已提醒过 */
const R_OFFSETS=[
  {label:'+15 分钟', ms:15*60e3},
  {label:'+30 分钟', ms:30*60e3},
  {label:'+1 小时', ms:60*60e3},
  {label:'+2 小时', ms:2*60*60e3},
  {label:'+3 小时', ms:3*60*60e3},
  {label:'+明天此刻', ms:24*60*60e3}
];
let draftRemind = null; // 编辑中的提醒时间戳（未保存前）
let clockTimer = null;

function fmtRemind(ts){
  if(!ts) return '';
  const d=new Date(ts), now=new Date();
  const y=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  let day;
  if(y(d)===y(now)) day='今天';
  else { const t=new Date(now); t.setDate(now.getDate()+1); day=(y(d)===y(t))?'明天':((d.getMonth()+1)+'月'+d.getDate()+'日'); }
  return day+' '+hm;
}
function remindLeft(ts){
  const ms=ts-Date.now();
  if(ms<=0) return '已到时间';
  const m=Math.round(ms/60000);
  if(m<60) return m+' 分钟后';
  const h=Math.floor(m/60), mm=m%60;
  if(h<24) return mm? h+' 小时 '+mm+' 分后' : h+' 小时后';
  return Math.floor(h/24)+' 天后';
}
function setDraftRemind(ts){ draftRemind=ts; renderRemindBox(); renderClock(); }
function clearDraftRemind(){ draftRemind=null; renderRemindBox(); renderClock(); }
function addRemindOffset(ms){ setDraftRemind(Date.now()+ms); }
/* 自定义时间段：自己填数字 + 选单位（分钟/小时/天） */
function setRemindOffset(){
  const nEl=$('#rOffNum'), uEl=$('#rOffUnit');
  if(!nEl||!uEl) return;
  const n=parseFloat(nEl.value);
  if(isNaN(n)||n<=0) return toast('先填个数字，比如 45');
  const unit=parseFloat(uEl.value)||60000;
  const ms=Math.round(n*unit);
  if(ms>365*24*60*60e3) return toast('最多一年以内');
  const ts=Date.now()+ms;
  setDraftRemind(ts);
  toast('已设 '+fmtRemind(ts)+'（'+remindLeft(ts)+'）');
}
function setRemindClock(){
  const hEl=$('#rHour'), mEl=$('#rMin'), dEl=$('#rDay');
  if(!hEl||!mEl||!dEl) return;
  let h=parseInt(hEl.value,10), mi=parseInt(mEl.value,10);
  if(isNaN(h)||isNaN(mi)||h<0||h>23||mi<0||mi>59) return toast('时间填 0-23 点 / 0-59 分');
  const d=new Date(); d.setSeconds(0,0); d.setHours(h,mi,0,0);
  if(dEl.value==='tomorrow' || d.getTime()<=Date.now()) d.setDate(d.getDate()+1);
  setDraftRemind(d.getTime());
  toast('已设 '+fmtRemind(d.getTime()));
}
function quickRemind(ts){
  // 详情页：直接给这条素材定闹钟
  const it=getCur(); if(!it) return;
  it.remindAt=ts; it.reminded=false; save(); renderHome();
  if(curId) openDetail(curId);
  toast('⏰ 已设 '+fmtRemind(ts)+'（'+remindLeft(ts)+'）');
}
function cancelRemind(id){
  const it=id? items.find(x=>x.id===id) : getCur(); if(!it) return;
  it.remindAt=null; it.reminded=false; save(); renderHome();
  if(curId&&id!==undefined) openDetail(curId);
  toast('已取消提醒');
}
function dueItems(){
  const now=Date.now();
  return items.filter(x=>x.remindAt && !x.reminded && x.remindAt<=now);
}
function remindBadge(it){
  if(!it.remindAt) return '';
  const done=it.reminded||it.remindAt<=Date.now();
  return '<span class="rtag'+(done?' done':'')+'">⏰ '+fmtRemind(it.remindAt)+'</span>';
}
let ringingIds=[];
function checkRemind(){
  const due=dueItems();
  if(!due.length) return;
  due.forEach(it=>{ it.reminded=true; });
  save();
  ringingIds=due.map(x=>x.id);
  const body=due.map(it=>'· '+(textOf(it).replace(/\s+/g,' ').slice(0,40)||'(图片/链接)')).join('<br>');
  const first=textOf(due[0]).replace(/\s+/g,' ').slice(0,40)||'随手库提醒';
  $('#ringTitle').textContent = due.length>1 ? (due.length+' 条提醒到点了') : '⏰ 提醒到点了';
  $('#ringBody').innerHTML = body;
  $('#ringMask').classList.add('on');
  renderHome(); if(curId) openDetail(curId);
  try{
    if(navigator.vibrate) navigator.vibrate([180,90,180]);
    if('Notification' in window && Notification.permission==='granted'){
      new Notification('随手库提醒 · '+fmtRemind(due[0].remindAt), {body:first});
    }
  }catch(e){}
}
function closeRing(){ $('#ringMask').classList.remove('on'); }
function ringGoEdit(){
  const id=ringingIds[0]; closeRing();

/* 提醒时间到了但当时页面没开 → 下次打开时补提醒 */
function missedRemind(){

  return items.filter(x=>x.remindAt && !x.reminded && x.remindAt<=now);

function blocksHTML(it){
  const parts=(blks(it)||[]).map(function(b){
    if(b.type==='t') return '<div class="fc-text">'+esc(b.t)+'</div>';
    if(b.type==='img') return '<img class="fc-media" src="'+b.d+'" onclick="event.stopPropagation()">';
    if(b.type==='video'){
      const src=b.vdata||(b.u&&/\.(mp4|webm|ogv|m3u8)(\?|#|$)/i.test(b.u)?b.u:null);
      if(src) return '<video class="fc-media" src="'+src+'" controls playsinline preload="metadata"></video>';
      return '<div class="fc-vlink" onclick="event.stopPropagation()">🔗 '+(b.u?esc(b.u):'(本地片段)')+'</div>';
    }
    return '';
  });
  return parts.join('');
}
function flipCardHTML(it){

/* ================= 复制 ================= */
function copyText(raw){
  const done=()=>toast('已复制 — 去别处粘贴吧');
  const fail=()=>toast('复制失败，长按文字手动复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(raw).then(done).catch(()=>fallback(raw)?done():fail());
  }else fallback(raw)?done():fail();
}
function fallback(t){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; } }
function copyTextOf(it){
  const lines=(blks(it)||[]).map(function(b){
    if(b.type==='t') return b.t||'';
    if(b.type==='img') return '[图片]';
    if(b.type==='video') return '[视频'+(b.u?': '+b.u:'')+']';
    return '';
  }).filter(function(x){ return String(x).trim(); });
  return lines.join('\n') || textOf(it);
}
function copyIt(id){ const it=items.find(x=>x.id===id); if(it) copyText(copyTextOf(it)); }

function renderNewEditor(){
  const w=$('#newEditor'); if(!w) return; w.innerHTML='';
  if(!draftBlocks.length){ w.innerHTML='<div class="blk-ph" style="padding:26px 6px;text-align:center;color:var(--ink3)">写点什么，或用下方 ＋ 加图片/链接</div>'; return; }
  draftBlocks.forEach(function(b,i){ w.appendChild(blockNode(b,i)); });
}
function blockNode(b,i){
  const d=document.createElement('div'); d.className='blk';
  const x=document.createElement('button'); x.className='blk-x'; x.textContent='✕'; x.setAttribute('aria-label','删这一块');
  x.onclick=function(){ delBlock(i); };
  if(b.type==='t'){
    const ta=document.createElement('textarea'); ta.className='blk-t';
    ta.placeholder='写点什么…（灵感 / 素材 / 金句）'; ta.value=b.t||'';
    const au=function(){ b.t=ta.value; ta.style.height='auto'; ta.style.height=Math.max(44,ta.scrollHeight)+'px'; };
    ta.addEventListener('input',au);
    d.appendChild(ta); d.appendChild(x);
    if(i===draftBlocks.length-1) setTimeout(au,0);
  }else if(b.type==='img'){
    const mp=document.createElement('div'); mp.className='pickpic';
    const ib=document.createElement('div'); ib.className='imgbtn'; ib.textContent=b.d?'↻ 换一张图':'＋ 选一张图片';
    const ip=document.createElement('input'); ip.type='file'; ip.accept='image/*';
    ip.addEventListener('change',function(e){
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=function(ev){ compressImg(ev.target.result,function(durl){ b.d=durl; renderNewEditor(); focusLastImg(); }); };
      rd.readAsDataURL(f); e.target.value='';
    });
    if(b.d){ const im=document.createElement('img'); im.src=b.d; im.style.cssText='width:100%;border-radius:12px;display:block;max-height:70vh;object-fit:contain'; im.onclick=function(){ ip.click(); }; mp.appendChild(im); }
    else mp.appendChild(ib);
    mp.appendChild(ip); d.appendChild(mp); d.appendChild(x);
  }else if(b.type==='video'){
    const u=document.createElement('div'); u.className='blk-video';
    u.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:0 2px"><span style="color:var(--ink3);font-size:14px;flex:none">🔗 链接</span><input type="url" class="blk-link" placeholder="粘贴网址，如 https://…（视频/文章/商品均可）"></div>'
      +'<div class="vhint" style="font-size:12.5px;color:var(--ink3);margin-top:6px;line-height:1.7"></div>'
      +'<label class="pickpic" style="display:block;margin-top:8px;border:1.5px dashed #D8CBB2;border-radius:14px;background:#fff;padding:0"><input type="file" accept="video/*" class="vpick"><div class="imgbtn" style="padding:9px;font-size:13.5px;background:none;border:none">（可选）本地小视频·很短才能存</div></label>';
    const linkIn=u.querySelector('.blk-link'); linkIn.value=b.u||'';
    linkIn.addEventListener('input',function(){ b.u=linkIn.value.trim(); b.title=''; renderVideoHint(u,b); });
    // 本地小视频选择（次要）
    u.querySelector('.vpick').addEventListener('change',function(e){
      const f=e.target.files&&e.target.files[0]; if(!f) return;
      if(f.size>15*1024*1024) return toast('视频超过 15MB，浏览器存不下，换短的试试');
      const rd=new FileReader();
      rd.onload=function(){ b.vdata=rd.result; b.u=''; b.vname=f.name||'视频'; renderVideoHint(u,b); };
      rd.readAsDataURL(f); e.target.value='';
    });
    renderVideoHint(u,b);
    d.appendChild(u); d.appendChild(x);
  }
  return d;
}
function renderVideoHint(el,b){
  const h=el.querySelector('.vhint'); if(!h) return;
  let html='';
  if(b.vdata){ html+='<span style="color:#2B6B3C">✓ 已选本地小视频（'+((b.vname||'').replace(/\.(mp4|mov|webm|3gp)$/i,'')||'视频')+'，'+Math.round((b.vdata.length*.75)/1024/1024*10)/10+'MB）</span>'
    +'<video src="'+b.vdata+'" controls playsinline style="width:100%;border-radius:12px;margin-top:6px;max-height:44vh"></video>'; }
  else if(b.u){ const isMp4=/\.(mp4|webm|ogv|m3u8)(\?|#|$)/i.test(b.u); html= isMp4
      ? '<video src="'+esc(b.u)+'" controls playsinline style="width:100%;border-radius:12px;max-height:44vh"></video>'
      : '<span style="color:var(--accent-deep)">🔗 已保存链接。分享到平台时用这个链接即可。</span>'; }
  else if(b.vdata){} else { html='贴链接最省空间（视频/文章/商品都行）；本地小视频只能存很短的。'; }
  h.innerHTML=html;
}
function focusText(){
  setTimeout(function(){ const t=$('#newEditor .blk-t'); if(t) t.focus(); },160);
}
function addBlock(type){
  if(type==='t'){ draftBlocks.push({type:'t',t:''}); renderNewEditor(); focusText(); }
  else if(type==='img'){ draftBlocks.push({type:'img',d:''}); renderNewEditor(); const last=$('#newEditor .blk:last-child input[type=file]'); if(last) last.click(); }
  else if(type==='video'){ draftBlocks.push({type:'video',u:'',vdata:'',vname:''}); renderNewEditor(); const li=$('#newEditor .blk:last-child .blk-link'); if(li) li.focus(); }
}
function delBlock(i){
  if(draftBlocks.length<=1 && draftBlocks[i] && draftBlocks[i].type==='t'){ draftBlocks=[{type:'t',t:''}]; }
  else draftBlocks.splice(i,1);
  renderNewEditor();
}
function collectBlocks(){
  // 清洗：去掉空文字块；有内容的留下
  const out=[];
  draftBlocks.forEach(function(b){
    if(b.type==='t'){ if(b.t && String(b.t).trim()) out.push({type:'t', t:b.t}); }
    else if(b.type==='img'){ if(b.d) out.push({type:'img', d:b.d}); }
    else if(b.type==='video'){ if(b.vdata||b.u) out.push({type:'video', u:b.u||'', vdata:b.vdata||'', vname:b.vname||'', title:b.title||''}); }
  });
  return out;
}
function compressImg(durl, cb){
  const img=new Image();
  img.onload=()=>{
    try{
      const MAX=1400; let w=img.width,h=img.height;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;} else {w=Math.round(w*MAX/h);h=MAX;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.85));
    }catch(err){
      cb(durl);
    }
  };
  img.onerror=()=>{ toast('这张图读不出来，换一张试试'); };
  img.src=durl;
}
function saveNote(){
  const blocks=collectBlocks();
  if(!blocks.length) return toast('写点什么，或＋图片/视频');
  if(editId){ // 编辑已有
    const it=items.find(x=>x.id===editId); if(!it) return;
    it.blocks=blocks; it.text=textOf(it); const m=firstMedia(it);
    it.kind=(m&&m.type==='img')?'img':(m&&m.type==='video'?'video':'text');
    if(m&&m.type==='img') it.img=m.d; else it.img=null;
    // v1.06：编辑时改「归类」要真的生效（以前点了没用，白改）
    if(CATS.indexOf(newCat)>=0) it.category=newCat;
    // 提醒：改了时间要重置"已提醒"，否则新时间不会响
    if(it.remindAt!==draftRemind) it.reminded=false;
    it.remindAt=draftRemind||null;
    save(); curCat=it.category||'杂记'; renderHome(); go('home'); toast(draftRemind? ('已保存 ✓ 提醒 '+fmtRemind(draftRemind)) : '已保存 ✓');
  }else{ // 新建
    const m=firstMedia({blocks:blocks});
    const it={ id:uid(), category:newCat, ts:Date.now(), blocks:blocks, text:textOf({blocks:blocks}) };
    if(m&&m.type==='img'){ it.kind='img'; it.img=m.d; }
    else if(m&&m.type==='video'){ it.kind='video'; }
    else it.kind='text';
    if(draftRemind){ it.remindAt=draftRemind; it.reminded=false; }
    items.push(it); save(); curCat=it.category||'杂记'; renderHome();
    go('home'); toast(draftRemind? ('已存为卡片 ✓ 提醒 '+fmtRemind(draftRemind)) : '已存为卡片 ✓');
  }
  editId=null; draftBlocks=[{type:'t',t:''}]; draftRemind=null;
}

function placeText(t){
  if(!t) return;
  // 找最后/聚焦的文字块插入；没有文字块则新建一个
  let tb=null;
  const active=document.activeElement;
  if(active && active.classList && active.classList.contains('blk-t')) tb=active;
  if(!tb){ const all=$('#newEditor .blk-t'); tb=all && all[all.length-1] ? all[all.length-1] : null; }
  if(tb){ tb.value = tb.value ? tb.value.replace(/\s*$/,'')+' '+t : t; const ev=new Event('input'); tb.dispatchEvent(ev); }
  else { draftBlocks.push({type:'t',t:t}); renderNewEditor(); }
  toast('已转成文字，可修改');
}

const CHIPS=['金句','灵感','读书','配图'];
function renderChips(){ $('#chips').innerHTML=CHIPS.map(c=>'<button class="chip" onclick="useChip(\''+c+'\')">'+c+'</button>').join(''); }
function useChip(c){ $('#sBox').value=c; doSearch(c); }
function doSearch(q){
  q=(q||'').trim();
  const res = q ? items.filter(i=>textOf(i).toLowerCase().includes(q.toLowerCase())) : sorted();
  $('#sCount').textContent = q ? (res.length?'找到 '+res.length+' 条': '') : '全部 '+res.length+' 条（按时间倒序）';
  $('#sResults').innerHTML = res.length ? res.map(it=>{
    const m=firstMedia(it);
    const tx=highlight(textOf(it)||(it.text||''),q);
    let media;
    if(m && m.type==='img'){ media='<div class="media-row"><div class="thumb"><img src="'+m.d+'"></div><div class="card-text">'+tx+'</div></div>'; }
    else if(m && m.type==='video'){ media='<div class="media-row"><div class="thumb vth" style="display:flex;align-items:center;justify-content:center;background:#F0EADA;color:var(--ink2)">🎬</div><div class="card-text">'+tx+'</div></div>'; }
    else { media='<div class="card-text">'+tx+'</div>'; }
    const kindCls=hasMedia(it)?' media':'';
    return '<article class="card'+kindCls+'" onclick="openDetail(\''+it.id+'\')"><div class="card-head"><span class="kind '+(hasMedia(it)?'img':'')+'"></span><span class="time">'+fmtDate(it.ts)+'</span></div>'+media+'<div class="card-actions"><button class="btn-copy" style="margin-left:auto" onclick="event.stopPropagation();copyIt(\''+it.id+'\')">⧉ 复制</button></div></article>';
  }).join('') : '<div class="empty"><span class="big">🔍</span>没有找到「'+esc(q)+'」</div>';
}
function highlight(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'随手库',ver:'v0.5',exported:new Date().toISOString(),items:items},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download='随手库备份_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('备份已导出 ✓');
}
(function(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json'; inp.id='impFile'; inp.style.display='none';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const data=JSON.parse(rd.result);
      if(!Array.isArray(data.items)) throw 0;
      const old=new Set(items.map(x=>x.id));
      let add=0; data.items.forEach(it=>{ if(it&&it.id&&!old.has(it.id)){ items.push(it); add++; } });
      if(!add) return toast('备份里没有新内容');
      save(); renderHome(); toast('导入 '+add+' 条 ✓');
    }catch(err){ toast('文件格式不对，换个备份试试'); } };
    rd.readAsText(f); e.target.value='';
  };
  document.body.appendChild(inp);
})();

  const vv = window.visualViewport;
  const isEdit = el => el && (el.tagName==='TEXTAREA' || el.tagName==='INPUT');
  const isMobile = () => window.matchMedia && matchMedia('(max-width:500px)').matches && !document.body.classList.contains('desktop');
  let maxVH = 0; // 键盘收起时见过的最大可视区高，用来判断键盘是否把可视区压矮了

  // 镜像测算：光标在屏幕上的 Y 位置
  function caretBottomY(el){
    const r = el.getBoundingClientRect();
    if(el.tagName !== 'TEXTAREA') return r.bottom;
    const cs = getComputedStyle(el);
    const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
    const m = document.createElement('div');
    m.style.cssText = 'position:absolute;visibility:hidden;left:-9999px;top:0;white-space:pre-wrap;word-wrap:break-word;box-sizing:content-box;padding:0;border:0';
    m.style.fontFamily = cs.fontFamily; m.style.fontSize = cs.fontSize;
    m.style.fontWeight = cs.fontWeight; m.style.lineHeight = cs.lineHeight;
    m.style.letterSpacing = cs.letterSpacing;
    m.style.width = Math.max(0, el.clientWidth - parseFloat(cs.paddingLeft||'0') - parseFloat(cs.paddingRight||'0')) + 'px';
    m.textContent = el.value.substring(0, pos);
    const s = document.createElement('span');
    s.textContent = '\u200b';
    m.appendChild(s);
    document.body.appendChild(m);
    const y = r.top + s.offsetTop + (parseFloat(cs.lineHeight) || parseFloat(cs.fontSize) || 16) + 4;
    document.body.removeChild(m);
    return y;
  }

  function scrollWinBy(dy){
    const before = window.pageYOffset;
    try{ window.scrollBy(0, dy); }catch(e){}
    // 个别 WebView window.scrollBy 无效时直接滚 body
    if(Math.abs(window.pageYOffset - before) < 1 && document.body && document.body.scrollHeight > document.body.clientHeight){
      document.body.scrollTop += dy;
    }
  }

  function fix(){
    const el = document.activeElement;
    if(!isEdit(el) || !isMobile()) return;
    requestAnimationFrame(function(){
      try{
        const inner = vv ? vv.height : window.innerHeight;
        if(inner > maxVH) maxVH = inner;
        const shrunk = (maxVH - inner) > 80;      // 键盘弹出时是否把可视区压矮了
        const kbLine = shrunk
          ? inner - 6                              // 压矮了：可视区底边就是键盘顶，直接用
          : inner * 0.62;                          // 悬浮键盘：按屏高62%估算键盘顶
        const lineH = 26;                          // 14px × 1.85 行高
        const target = kbLine - 3.4 * lineH;       // 停靠：键盘上方约三行
        const limit = kbLine - 1.6 * lineH;        // 离键盘一行半以内才滚，平时不动
        const cb = caretBottomY(el);
        if(cb > limit) scrollWinBy(cb - target);
        else if(cb < 0) scrollWinBy(cb - 20);
      }catch(e){}
    });
  }
  document.addEventListener('focusin', function(e){
    if(!isEdit(e.target) || !isMobile()) return;
    // 垫底部空间：保证文档有足够滚动余量，最后一块字也不会被顶死在页底
    if(document.body && !document.body.dataset.kbPad){
      document.body.dataset.kbPad = '1';
      document.body.style.paddingBottom = '45vh';
    }
    fix();
    [120, 300, 600, 900].forEach(function(t){ setTimeout(fix, t); });
  }, true);
  document.addEventListener('focusout', function(){
    setTimeout(function(){
      const el = document.activeElement;
      if(!isEdit(el) && document.body && document.body.dataset.kbPad){
        delete document.body.dataset.kbPad;
        document.body.style.paddingBottom = '';
      }
    }, 60);
  });
  document.addEventListener('input', function(e){ if(isEdit(e.target)) fix(); }, true);
  window.addEventListener('resize', fix);
  if(vv){ vv.addEventListener('resize', fix); vv.addEventListener('scroll', fix); }
})();

/* ===== PWA 缓存根治：检测到新版本 → 弹条提醒刷新 ===== */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // ① 每次打开都主动查一次有没有新版本（后台会去比对 sw.js 字节）
      reg.update();
      // ② 后台检测到"正在安装的新 SW"，等它装完
      let refreshing=false;
      navigator.serviceWorker.addEventListener('controllerchange', ()=>{
        // 新 SW 已接管 → 自动刷新一次拿最新页面（只刷一次防循环）
        if(refreshing) return; refreshing=true;
        location.reload();
      });
      reg.addEventListener('updatefound', ()=>{
        const nw=reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller){
            // 已有一个旧版在跑，现在后台装好了新版 → 提示用户"刷一下"（自动刷新兜底见下）
            toast('发现新版本，正在为你更新…');
            // 尝试等新 SW 接管；若 3 秒没接管（旧窗口卡着）则直接整页刷新一次
            setTimeout(()=>{
              if(reg.active && !navigator.serviceWorker.controller) return;
              if(!refreshing){ refreshing=true; location.reload(); }
            }, 3000);
          }
        });
      });
    }).catch(()=>{});
  });
}
</script>
