<style>

  .shell{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;z-index:0}
  body.desktop{background:radial-gradient(1200px 700px at 70% -10%,#EFE7D8 0%,#E4DAC6 55%,#DDD2BC 100%)}
  body.desktop .phone{width:400px;height:min(860px,94vh);border-radius:52px;box-shadow:0 30px 80px rgba(50,35,10,.35),0 0 0 10px #1B1916,0 0 0 12px #333}

  .screens{flex:1;position:relative;overflow:hidden}
  .screen{position:absolute;inset:0;overflow-y:auto;padding:0 18px calc(18px + env(safe-area-inset-bottom,0px));display:none;scrollbar-width:none}

  .screen.active{display:block}

  /* ============ 首页翻卡 ============ */
  #home{padding:0;display:none;flex-direction:column}
  #home.active{display:flex}
  .home-top{flex:none;display:flex;align-items:center;gap:10px;padding:13px 18px 8px}
  .brand{display:flex;align-items:center;gap:8px}
  .brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#D0602B,#A8481D);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;box-shadow:0 2px 8px rgba(192,86,33,.4)}
  .brand .nm{font-size:21px;font-weight:800;letter-spacing:1px}
  .page-num{flex:1;text-align:center;font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:2px}
  .top-right{margin-left:auto;display:flex}
  .iconbtn{border:none;background:none;width:40px;height:40px;border-radius:12px;font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
  .iconbtn:active{background:#ECE4D4}
  .flipwrap{flex:1;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
  .flipwrap::-webkit-scrollbar{display:none}
  .flipcard{
    height:100%;scroll-snap-align:start;scroll-snap-stop:always;
    display:flex;flex-direction:column;padding:4px 18px 16px;animation:fadeUp .35s ease;
  }
  /* 电脑预览翻页控件（手机不显示） */
  body.desktop .flipnav{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:20}
  .flipnav{display:none}
  body.desktop .flipnav button{
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:22px;
    background:rgba(255,255,255,.92);color:var(--accent);box-shadow:0 4px 14px rgba(60,45,20,.18);
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  }
  body.desktop .flipnav button:active{transform:scale(.94)}
  #home{position:relative}
  @keyframes fadeUp{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fc-pad{flex:1;overflow-y:auto;scrollbar-width:none;min-height:0}
  .fc-pad::-webkit-scrollbar{display:none}
  .fc-card{
    background:var(--card);border:1px solid rgba(237,229,214,.6);border-radius:24px;
    box-shadow:var(--shadow);padding:26px 24px;min-height:100%;display:flex;flex-direction:column;
  }
  .fc-card.flash{animation:flash 1.5s ease}
  @keyframes flash{0%{box-shadow:0 0 0 4px rgba(192,86,33,.5)}100%{box-shadow:var(--shadow)}}
  .fc-meta{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink3);margin-bottom:16px}
  .fc-meta .kind{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .fc-meta .kind.img{background:#8A9B7E}
  .fc-meta .tag{background:var(--accent-soft);color:var(--accent-deep);font-weight:700;padding:3px 12px;border-radius:30px;font-size:13px}
  .fc-meta .t{font-weight:600;margin-left:auto;letter-spacing:.5px}
  .fc-media{width:100%;border-radius:18px;margin-bottom:18px;max-height:38vh;object-fit:cover;background:#EDE7DB}
  .fc-text{font-size:20px;line-height:1.95;letter-spacing:.2px;white-space:pre-wrap;word-break:break-word;color:var(--ink);font-weight:500}
  .fc-actions{flex:none;display:flex;gap:12px;padding-top:14px}
  .fc-edit{flex:none;width:92px;height:58px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .fc-edit:active{background:#F7F2E8}
  .fc-copy{
    flex:1;height:58px;border-radius:18px;border:none;cursor:pointer;
    background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;font-size:19px;font-weight:800;letter-spacing:2px;
    box-shadow:0 5px 16px rgba(192,86,33,.4);display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .fc-copy:active{transform:scale(.985)}
  .flip-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;color:var(--ink3);font-size:17px;line-height:2;padding:0 30px}
  .flip-empty .big{font-size:56px}
  .flip-empty button{margin-top:10px;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;border:none;border-radius:18px;height:58px;padding:0 34px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(192,86,33,.4)}

  /* ============ 其他页面字号放大 ============ */
  .nav{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;align-items:center;gap:6px;padding:14px 0 6px}
  .nav .back{border:none;background:none;font-size:26px;color:var(--ink);cursor:pointer;padding:2px 10px 2px 0;line-height:1}
  .nav .ttl{font-size:19px;font-weight:800;flex:1}
  .nav .act{border:none;background:none;color:var(--accent);font-size:17px;font-weight:800;cursor:pointer;padding:8px 4px}
  .nav .act.dim{color:var(--ink3);font-weight:600;font-size:21px}
  .new-hint{font-size:14px;color:var(--ink3);background:#FBF7EE;border:1px dashed #E2D6C0;border-radius:14px;padding:11px 14px;margin:4px 0 12px;line-height:1.8}
  .attach-box{display:flex;gap:10px;flex-wrap:wrap;padding:2px 0 10px}
  .imgth{width:104px;height:104px;border-radius:16px;position:relative;overflow:hidden;flex:none}
  .imgth img{width:100%;height:100%;object-fit:cover}
  .imgth .x{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:none;font-size:14px;cursor:pointer;line-height:1}
  .editor{width:100%;min-height:200px;border:none;outline:none;background:transparent;resize:none;font-size:20px;line-height:1.95;color:var(--ink);font-family:inherit;padding:4px 2px;font-weight:500}
  .editor::placeholder{color:var(--ink3);font-weight:400}
  .inputtools{position:sticky;bottom:0;display:flex;gap:10px;padding:10px 0 4px;background:linear-gradient(180deg,rgba(245,240,230,0) 0%,var(--bg) 35%)}
  .toolbtn{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:16px;font-weight:700;color:var(--ink2);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbtn:active{background:#F7F2E8}
  .toolbtn.mic{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;font-size:18px}
  .toolbtn.pic{padding:14px 18px}

  /* 语音 */
  .micoverlay{position:absolute;inset:0;background:rgba(43,38,32,.74);backdrop-filter:blur(6px);z-index:40;display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
  .micoverlay.on{display:flex}
  .mic-ring{width:122px;height:122px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;animation:pulse 1.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,86,33,.45)}70%{box-shadow:0 0 0 36px rgba(192,86,33,0)}100%{box-shadow:0 0 0 0 rgba(192,86,33,0)}}
  .mic-ring svg{width:46px;height:46px;fill:#fff}
  .mic-wave{display:flex;gap:5px;align-items:center;height:36px}.mic-wave i{width:4px;border-radius:2px;background:#fff;animation:wave 1s ease-in-out infinite}
  .mic-wave i:nth-child(1){height:15px}.mic-wave i:nth-child(2){height:32px;animation-delay:.1s}.mic-wave i:nth-child(3){height:21px;animation-delay:.2s}.mic-wave i:nth-child(4){height:34px;animation-delay:.3s}.mic-wave i:nth-child(5){height:17px;animation-delay:.4s}.mic-wave i:nth-child(6){height:30px;animation-delay:.15s}.mic-wave i:nth-child(7){height:13px;animation-delay:.35s}
  @keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1.15)}}
  .mic-label{color:#fff;font-size:17px;font-weight:800;letter-spacing:1px}
  .mic-sub{color:rgba(255,255,255,.8);font-size:13px}
  .tip-card{background:#FFF7EC;border:1px solid #F0DFC4;border-radius:14px;padding:13px 15px;margin:10px 0;font-size:15px;line-height:1.9;color:var(--ink2)}
  .tip-card b{color:var(--accent-deep)}

  /* 详情 */
  .detail-time{font-size:14px;color:var(--ink3);margin:2px 2px 12px}
  .d-body{background:var(--card);border:1px solid rgba(237,229,214,.6);border-radius:22px;box-shadow:var(--shadow);padding:22px}
  .d-body .bigimg{width:100%;border-radius:14px;margin-bottom:16px;max-height:300px;object-fit:cover}
  .d-body textarea{width:100%;min-height:200px;border:none;outline:none;background:transparent;font-size:19px;line-height:2;color:var(--ink);font-family:inherit;resize:vertical;font-weight:500}
  .d-bar{display:flex;gap:10px;align-items:center;margin-top:16px}
  .d-main{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;border:none;border-radius:18px;height:56px;font-size:18px;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 16px rgba(192,86,33,.35)}
  .d-main:active{transform:scale(.985)}
  .d-sec{height:56px;padding:0 20px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:16px;font-weight:700;cursor:pointer}

  /* 搜索 */
  .s-input{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;flex:1;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .s-input input{border:none;outline:none;flex:1;font-size:18px;background:transparent;color:var(--ink);font-family:inherit;min-width:0}
  .s-input input::placeholder{color:var(--ink3)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
  .chip{font-size:15px;background:#fff;border:1px solid var(--line);color:var(--ink2);padding:8px 16px;border-radius:30px;cursor:pointer}
  .chip:active{background:var(--accent-soft)}
  .s-count{font-size:14px;color:var(--ink3);margin:16px 2px 10px}
  mark{background:#F6D9A8;color:inherit;border-radius:3px;padding:0 1px}
  .card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);cursor:pointer;border:1px solid rgba(237,229,214,.6);transition:transform .12s ease}
  .card:active{transform:scale(.985)}
  .card-head{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink3);margin-bottom:10px}
  .card-head .kind{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
  .card-head .kind.img{background:#8A9B7E}
  .card-head .time{margin-left:auto;font-weight:600}
  .card-text{font-size:18px;line-height:1.9;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .card.media .media-row{display:flex;gap:12px;align-items:stretch}
  .card.media .thumb{width:96px;height:96px;border-radius:14px;flex:none;overflow:hidden;background:#EDE7DB;display:flex;align-items:center;justify-content:center}
  .card.media .thumb img{width:100%;height:100%;object-fit:cover}
  .card.media .card-text{-webkit-line-clamp:4;font-size:17px}
  .card-actions{display:flex;align-items:center;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid #F3EDE1}
  .btn-copy{margin-left:auto;display:flex;align-items:center;gap:5px;color:var(--accent);font-size:15px;font-weight:800;background:none;border:none;cursor:pointer;padding:7px 9px;border-radius:9px}
  .btn-copy:active{background:var(--accent-soft)}
  .empty{padding:60px 12px;text-align:center;color:var(--ink3);font-size:16px;line-height:2.1}
  .empty .big{font-size:46px;display:block;margin-bottom:10px}

  /* 底栏 */
  .tabbar{flex:none;height:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;align-items:stretch;position:relative;z-index:10}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;cursor:pointer;color:var(--ink3);font-size:12px;font-weight:600}

  .tab-plus-wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;position:relative}
  .tab-plus{width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;margin-top:-22px;background:linear-gradient(145deg,#D0602B,#A8481D);color:#fff;font-size:27px;box-shadow:0 6px 18px rgba(192,86,33,.45);display:flex;align-items:center;justify-content:center}
  .tab-plus:active{transform:scale(.94)}

  /* 弹层 */
  .sheet-mask{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .sheet-mask.on{display:flex}
  .sheet{width:min(470px,100%);background:#FFFDF8;border-radius:24px 24px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom,0px));max-height:78vh;overflow-y:auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  .sheet .bar{width:42px;height:4px;border-radius:2px;background:#E2D9C6;margin:4px auto 14px}
  .sheet h3{font-size:17px;margin-bottom:4px;font-weight:800}
  .srow{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid #F1EADA;font-size:16px;font-weight:600;cursor:pointer}
  .srow:last-child{border-bottom:none}.srow:active{background:#F7F1E4;border-radius:10px}
  .srow .si{font-size:20px}
  .srow.danger{color:#C0392B}
  .srow small{color:var(--ink3);font-size:13px;margin-left:auto;font-weight:400}

  /* toast */
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);z-index:99;background:#2B2620;color:#fff;font-size:16px;padding:13px 22px;border-radius:40px;opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<script>
/* ================= 存储 ================= */
const KEY = 'suishouku_v05';
let items = [];
try{ items = JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ items = []; }
function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastTimer;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2100); }
function fmtDate(ts){
  const d=new Date(ts), now=new Date();
  const y=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(y(d)===y(now)) return '今天 '+hm;
  const yest=new Date(now); yest.setDate(now.getDate()-1);
  if(y(d)===y(yest)) return '昨天 '+hm;
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function shortDate(ts){
  const d=new Date(ts);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function sorted(){ return items.slice().sort((a,b)=>b.ts-a.ts); }

/* ================= 页面 ================= */
function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+name).classList.add('active');
  const sc=document.querySelector('.screen.active');
  if(name!=='home' && sc) sc.scrollTop=0;
  $('#tab-home').classList.toggle('active', name==='home');
  $('#tab-search').classList.toggle('active', name==='search');
  if(name==='home'){ const w=$('#flipwrap'); if(w) w.scrollTop=0; updatePageNum(); }
  if(name==='search'){ setTimeout(()=>{ $('#sBox').focus(); doSearch($('#sBox').value); },80); }
}
function backHome(){ go('home'); renderHome(); }

/* ================= 首页翻卡渲染 ================= */
function flipCardHTML(it, idx, total){
  const media = it.img ? '<img class="fc-media" src="'+it.img+'" onclick="event.stopPropagation()">' : '';
  const tag = it.tag ? '<span class="tag">'+esc(it.tag)+'</span>' : '';
  return '<article class="flipcard" data-id="'+it.id+'">'+
    '<div class="fc-pad"><div class="fc-card'+(idx===0?' flash':'')+'">'+
      '<div class="fc-meta"><span class="kind '+(it.kind==='img'?'img':'')+'"></span>'+tag+'<span class="t">'+fmtDate(it.ts)+'</span></div>'+
      media+
      '<div class="fc-text">'+esc(it.text)+'</div>'+
    '</div></div>'+
    '<div class="fc-actions">'+
      '<button class="fc-edit" onclick="openDetail(\''+it.id+'\')">✎ 改</button>'+
      '<button class="fc-copy" onclick="copyIt(\''+it.id+'\')">⧉ 复制</button>'+
    '</div></article>';
}
function renderHome(){
  const list = sorted();
  const w = $('#flipwrap');
  if(!list.length){
    w.innerHTML = '<div class="flip-empty"><span class="big">📥</span><div>随手库还空着<br>点下面 ＋ 记第一条素材</div><button onclick="openNew()">＋ 记一条</button></div>';
    $('#pageNum').textContent = '';
    return;
  }
  w.innerHTML = list.map((it,i)=>flipCardHTML(it,i,list.length)).join('');
  w.scrollTop = 0;
  updatePageNum();
}
function updatePageNum(){
  const w=$('#flipwrap'); if(!w) return;
  const list=sorted();
  if(!list.length){ $('#pageNum').textContent=''; return; }
  const cardH = (w.querySelector('.flipcard')||{offsetHeight:1}).offsetHeight || 1;
  let idx = Math.round(w.scrollTop / cardH);
  idx = Math.max(0, Math.min(list.length-1, idx));
  $('#pageNum').textContent = (idx+1)+' / '+list.length;
  $('#pageNum').dataset.idx = idx;
}
(function(){
  const w=$('#flipwrap');
  let ticking=false;
  w.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking=true;
    requestAnimationFrame(()=>{ updatePageNum(); ticking=false; });
  });
})();

/* 电脑预览翻页：箭头 + 键盘（手机触摸滑动时不受影响） */
function flipBy(dir){
  const w=$('#flipwrap'); if(!w) return;
  const list=sorted(); if(!list.length) return;
  const cardH=w.clientHeight;
  const cur=Math.round(w.scrollTop/cardH);
  const target=Math.max(0, Math.min(list.length-1, cur+dir));
  w.scrollTo({top:target*cardH, behavior:'smooth'});
}
(function(){
  if(!document.body.classList.contains('desktop')) return;
  $('#prevCard').addEventListener('click',()=>flipBy(-1));
  $('#nextCard').addEventListener('click',()=>flipBy(1));
  document.addEventListener('keydown',e=>{
    if(!document.querySelector('#home.active')) return;
    const tag=(document.activeElement||{}).tagName||'';
    if(tag==='INPUT'||tag==='TEXTAREA') return;
    if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); flipBy(1); }
    else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); flipBy(-1); }
    else if(e.key==='Home'){ e.preventDefault(); flipBy(-9999); }
    else if(e.key==='End'){ e.preventDefault(); flipBy(9999); }
  });
})();

/* ================= 复制 ================= */
function copyText(raw){
  const done=()=>toast('已复制 — 去别处粘贴吧');
  const fail=()=>toast('复制失败，长按文字手动复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(raw).then(done).catch(()=>fallback(raw)?done():fail());
  }else fallback(raw)?done():fail();
}
function fallback(t){ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){ return false; } }
function copyIt(id){ const it=items.find(x=>x.id===id); if(it) copyText(it.text); }

/* ================= 新建 ================= */
let pendingImgs = [];
function openNew(){ pendingImgs=[]; $('#attachBox').innerHTML=''; $('#editor').value=''; renderVoiceState(); go('new'); setTimeout(()=>$('#editor').focus(),150); }
$('#picFile').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  if(pendingImgs.length>=3) return toast('最多 3 张图（第一版先这样）');
  const rd=new FileReader();
  rd.onload=ev=>compressImg(ev.target.result, durl=>{
    pendingImgs.push(durl);
    const d=document.createElement('div'); d.className='imgth';
    d.innerHTML='<img src="'+durl+'"><button class="x">✕</button>';
    d.querySelector('.x').onclick=()=>{ d.remove(); pendingImgs=pendingImgs.filter(x=>x!==durl); };
    $('#attachBox').appendChild(d);
  });
  rd.readAsDataURL(f); e.target.value='';
});
function compressImg(durl, cb){
  const img=new Image();
  img.onload=()=>{
    const MAX=1400; let w=img.width,h=img.height;
    if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;} else {w=Math.round(w*MAX/h);h=MAX;} }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',.85));
  };
  img.src=durl;
}
function saveNote(){
  const t=$('#editor').value.trim();
  if(!t && !pendingImgs.length) return toast('写点什么，或按住话筒说一句');
  const it={ id:uid(), kind:pendingImgs.length?'img':'text', text:t||'(图片)', img:pendingImgs[0]||null, tag:'', ts:Date.now() };
  items.push(it); save(); renderHome();
  pendingImgs=[]; $('#attachBox').innerHTML=''; $('#editor').value='';
  go('home'); toast('已存为卡片 ✓');
}

/* ================= 语音 ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICE_TIP = '检测到当前浏览器语音识别不可用（国内手机/电脑常见）。<b>替代办法：点输入框弹键盘后，按键盘上的麦克风键说话</b>，一样是语音转文字。正式版会接入国内语音服务。';
function renderVoiceState(){
  const t=$('#voiceTip');
  if(!SR){ t.style.display='block'; t.innerHTML=VOICE_TIP; }
}
(function(){
  if(!SR) return;
  const ov=$('#micOv');
  const rec=new SR(); rec.lang='zh-CN'; rec.interimResults=false; rec.continuous=false; rec.maxAlternatives=1;
  let recText='', down=false, on=false;
  rec.onstart=()=>{ on=true; $('#micLabel').textContent='正在听…'; $('#micSub').textContent='松开手指结束'; };
  rec.onresult=e=>{ recText=''; for(let i=0;i<e.results.length;i++) recText+=e.results[i][0].transcript; };
  rec.onerror=()=>{ ov.classList.remove('on'); if(recText) placeText(recText); else if(on) toast('没听清，再试一次？'); };
  rec.onend=()=>{ ov.classList.remove('on'); on=false; if(recText){ placeText(recText); recText=''; } };
  const btn=$('#micBtn');
  function start(e){ if(down)return; down=true; recText=''; on=false; try{ rec.start(); ov.classList.add('on'); }catch(err){} e.preventDefault(); }
  function end(){ if(!down)return; down=false; try{ rec.stop(); }catch(err){} setTimeout(()=>ov.classList.remove('on'),350); }
  btn.addEventListener('pointerdown',start);
  btn.addEventListener('pointerup',end);
  btn.addEventListener('pointerleave',end);
  btn.addEventListener('click',()=>{ if(!SR){ /* noop */ } });
})();
function placeText(t){
  const ta=$('#editor');
  ta.value = ta.value ? ta.value.replace(/\s*$/,'')+' '+t : t;
  ta.scrollTop=ta.scrollHeight;
  toast('已转成文字，可修改');
}

/* ================= 详情/编辑 ================= */
let curId=null;
function openDetail(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  curId=id;
  $('#dTitle').textContent = it.tag || '素材';
  $('#dTime').textContent = fmtDate(it.ts) + ' · ' + (it.kind==='img'?'图文':'文本');
  $('#dBody').innerHTML = (it.img?'<img class="bigimg" src="'+it.img+'">':'') +
    '<textarea id="dText">'+esc(it.text)+'</textarea>';
  go('detail');
  setTimeout(()=>{ const ta=$('#dText'); if(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+30)+'px'; } },60);
}
function getCur(){ return items.find(x=>x.id===curId); }
function saveDetail(){ const it=getCur(); if(!it)return; it.text=$('#dText').value.trim()||'(图片)'; save(); toast('修改已保存 ✓'); }
function copyDetail(){ const it=getCur(); if(!it)return; copyText(it.text); }
function delCur(){ items=items.filter(x=>x.id!==curId); save(); curId=null; closeSheet(); renderHome(); go('home'); toast('已删除'); }

/* ================= 搜索 ================= */
const CHIPS=['金句','灵感','读书','配图'];
function renderChips(){ $('#chips').innerHTML=CHIPS.map(c=>'<button class="chip" onclick="useChip(\''+c+'\')">'+c+'</button>').join(''); }
function useChip(c){ $('#sBox').value=c; doSearch(c); }
function doSearch(q){
  q=(q||'').trim();
  const res = q ? items.filter(i=>i.text.toLowerCase().includes(q.toLowerCase())) : sorted();
  $('#sCount').textContent = q ? (res.length?'找到 '+res.length+' 条': '') : '全部 '+res.length+' 条（按时间倒序）';
  $('#sResults').innerHTML = res.length ? res.map(it=>{
    const media=it.kind==='img'
      ? '<div class="media-row"><div class="thumb"><img src="'+it.img+'"></div><div class="card-text">'+highlight(it.text,q)+'</div></div>'
      : '<div class="card-text">'+highlight(it.text,q)+'</div>';
    return '<article class="card'+(it.kind==='img'?' media':'')+'" onclick="openDetail(\''+it.id+'\')"><div class="card-head"><span class="kind '+(it.kind==='img'?'img':'')+'"></span><span class="time">'+fmtDate(it.ts)+'</span></div>'+media+'<div class="card-actions"><button class="btn-copy" style="margin-left:auto" onclick="event.stopPropagation();copyIt(\''+it.id+'\')">⧉ 复制</button></div></article>';
  }).join('') : '<div class="empty"><span class="big">🔍</span>没有找到「'+esc(q)+'」</div>';
}
function highlight(text,q){
  if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length));
}

/* ================= 菜单/弹层 ================= */
function openSheet(kind){
  let h='';
  if(kind==='menu'){
    h='<h3>随手库 v0.5</h3>'
    + row('📲','装到桌面图标','小米浏览器请换 Chrome/Edge','help')
    + row('📤','导出备份','全部 '+items.length+' 条下载成文件','export')
    + row('📥','导入备份','从备份文件恢复/合并','import')
    + row('🗑','清空全部内容','清空后不可恢复','wipe',true);
  }else if(kind==='item'){
    h='<h3>这条素材</h3>'
    + row('📋','复制全文','','copyCur')
    + row('🏷','加标签','v1 版本再做')
    + row('🗑','删除这条','','delCur',true);
  }else if(kind==='help'){
    h='<h3>装到手机桌面</h3><div class="tip-card" style="line-height:2;font-size:15px"><b style="color:#A34419">⚠️ 小米浏览器的 PWA 安装支持不完整</b>，看不到"添加到主屏幕"很正常。<br><br><b>① 装 Chrome 或 Edge</b><br>小米应用商店搜 <b>「Chrome」</b> 或 <b>「Edge」</b> 装上（免费，几十 MB）。<br><br><b>② 用 Chrome / Edge 打开此链接</b><br>把链接复制过去，或用新浏览器打开文件传输助手里的链接。<br><br><b>③ 装到桌面</b><br>浏览器右上角 ⋮ 菜单 → 选 <b>「安装应用」</b>（Chrome）或 <b>「添加到主屏幕」</b>（Edge）。<br><br><b>④ 完成</b><br>桌面出现橙色"随"字图标 = 装好了，以后点它就用。<br><br><b>兜底：</b>小米浏览器可以菜单 → "收藏到桌面"凑合当快捷方式，但不是全屏 App 体验。</div>';
  }
  $('#sheetBody').innerHTML=h;
  $('#sheetMask').classList.add('on');
}
function row(icon,label,sub,fn,danger){
  return '<div class="srow'+(danger?' danger':'')+'" onclick="'+(fn?'sheetAction(\''+fn+'\')':'toast(\'v1 版本再做\')')+'"><span class="si">'+icon+'</span>'+label+(sub?'<small>'+sub+'</small>':'')+'</div>';
}
function sheetAction(fn){
  closeSheet();
  if(fn==='export') exportBackup();
  if(fn==='import') $('#impFile').click();
  if(fn==='wipe'){ if(confirm('确定清空全部内容？此操作不可恢复（建议先导出备份）')){ items=[]; save(); renderHome(); toast('已清空'); } }
  if(fn==='help') openSheet('help');
  if(fn==='copyCur') copyDetail();
  if(fn==='delCur'){ if(confirm('删除这条素材？')) delCur(); }
}
function closeSheet(){ $('#sheetMask').classList.remove('on'); }
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'随手库',ver:'v0.5',exported:new Date().toISOString(),items:items},null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download='随手库备份_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
  toast('备份已导出 ✓');
}
(function(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json'; inp.id='impFile'; inp.style.display='none';
  inp.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ try{
      const data=JSON.parse(rd.result);
      if(!Array.isArray(data.items)) throw 0;
      const old=new Set(items.map(x=>x.id));
      let add=0; data.items.forEach(it=>{ if(it&&it.id&&!old.has(it.id)){ items.push(it); add++; } });
      if(!add) return toast('备份里没有新内容');
      save(); renderHome(); toast('导入 '+add+' 条 ✓');
    }catch(err){ toast('文件格式不对，换个备份试试'); } };
    rd.readAsText(f); e.target.value='';
  };
  document.body.appendChild(inp);
})();

/* ================= 首启引导 ================= */
(function(){
  if(!items.length){
    const now=Date.now();
    items=[
      {id:uid(),kind:'text',text:'欢迎来到随手库 👋\n\n以后看到想留的东西——灵感、金句、好段落——先丢到这里，用的时候一键复制出去。\n\n这一页像翻书一样，上下滑就能翻到下一条。\n\n这条是示例，点下面"✎ 改"进来可以删掉。',tag:'',ts:now-3*60000},
      {id:uid(),kind:'text',text:'示例：去底栏"搜索"输入"灵感"两个字，看看搜得准不准。',tag:'',ts:now-30*60000},
    ];
    save();
  }
  renderHome(); renderChips();
  const isNarrow=matchMedia('(max-width:500px)').matches;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(isNarrow||standalone) document.body.classList.remove('desktop');
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
